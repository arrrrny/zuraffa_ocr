# Federated plugin monorepo created by `zfa package create-plugin` (issue #1604).
name: zuraffa_ocr
description: >-
  Typed OCR support for the Zuraffa ecosystem: a pure-Dart port, recognition lifecycle, and typed failures behind an injected platform channel with federated adapters.
version: 7.3.2
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0

dependencies:
  zuraffa: ^7.3.2

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

repository: https://github.com/arrrrrny/zuraffa_ocr
issue_tracker: https://github.com/arrrrrny/zuraffa_ocr/issues

topics:
  - ocr
  - clean-architecture
  - zuraffa

# Fleet-wide xml policy: pin the override to the latest xml so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly.
dependency_overrides:
  xml: 7.1.0

  zuraffa:
    path: ../../../zuraffa
